<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Săn Ảnh Quân Sự SOTA K5 📸</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="step1-screen" class="screen active">
        <div class="sota-collage">
            <div class="window-shadow"></div>
            <div class="tree-shadow"></div>
            
            <i class="fa-solid fa-film decor-film-1"></i>
            <i class="fa-solid fa-film decor-film-2"></i>
            <i class="fa-solid fa-paper-plane decor-plane-1"></i>
            
            <img src="PNG/co-viet-nam.png" class="real-flag" alt="Cờ Tổ Quốc">
            <img src="PNG/co-viet-nam-tren.png" class="mobile-flag-top" alt="Cờ trên mobile">
            <img src="PNG/co-viet-nam-duoi.png" class="mobile-flag-bottom" alt="Cờ dưới mobile">
            <img src="PNG/mu-coi.png" class="real-helmet" alt="Mũ Cối">

            <i class="fa-solid fa-dove glowing-dove dove-1"></i>
            <i class="fa-solid fa-dove glowing-dove dove-2"></i>

            <div class="light-flare flare-1"></div>
            <div class="light-flare flare-2"></div>
        </div>

        <div class="header">
            <p class="subtitle">Thanh xuân gọi tên K5 ơi!</p>
            <h1>Săn Ảnh SOTA <i class="fa-solid fa-camera-retro"></i></h1>
        </div>

        <div class="form-container">
            <div class="input-group">
                <label><i class="fa-solid fa-user"></i> Họ và Tên</label>
                <input type="text" id="fullname" placeholder="VD: Đỗ Quang Huy" required>
            </div>
            
            <div class="input-group">
                <label><i class="fa-solid fa-id-card"></i> Mã số sinh viên</label>
                <input type="text" id="studentid" placeholder="VD: BEC250024" required>
            </div>

            <div class="input-group">
                <label><i class="fa-solid fa-phone"></i> SĐT Zalo (Để nhận ảnh)</label>
                <input type="tel" id="zalo" placeholder="VD: 0399182748" required>
            </div>

            <button id="btn-next-map" class="btn-primary">
                Tiếp tục chọn mốc trên bản đồ <i class="fa-solid fa-map-location-dot"></i>
            </button>
        </div>
    </div>

    <div id="step23-screen" class="screen">
        <div class="sota-collage">
            <div class="window-shadow"></div>
            <div class="tree-shadow"></div>
        </div>

        <div class="status-bar game-dialogue">
            <img src="PNG/do-quang-huy.jpg" alt="Avatar Người chụp" class="photographer-avatar">
            
            <div class="status-text">
                <p class="status-label">
                    <i class="fa-solid fa-satellite-dish fa-beat" style="color: #ef4444;"></i> 
                    TRẠNG THÁI CẬP NHẬT TRỰC TIẾP TỪ NGƯỜI CHỤP <span class="pro-badge">SOTA</span>
                </p>
                <p id="photographer-status" class="typewriter">😴😴😴</p>
            </div>
        </div>

        <div id="status-tools" class="tools-container hidden">
            <img id="vinyl-record" src="PNG/cute-cat.png" alt="Đĩa nhạc" class="vinyl-record">
            
            <div class="tool-btn-group-new">
                <button id="btn-firework" class="tool-btn-text">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Bắn Pháo Hoa</span>
                </button>
                <button id="btn-play-pause" class="tool-btn-text">
                    <i class="fa-solid fa-pause"></i> <span>Phát/Dừng Nhạc</span>
                </button>
                <button id="btn-replay" class="tool-btn-text">
                    <i class="fa-solid fa-rotate-left"></i> <span>Phát Từ Đầu</span>
                </button>
            </div>
        </div>

        <div id="region-selector-container" class="instruction-box" style="margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px;">
            <label for="region-selector" style="font-weight: 800; font-size: 14px;"><i class="fa-solid fa-map-location-dot"></i> Chọn khu vực tác nghiệp:</label>
            <select id="region-selector" style="padding: 12px; border-radius: 8px; border: 2px solid #78350f; font-weight: 700; color: #78350f; background: rgba(255,255,255,0.9); outline: none; font-size: 14px; cursor: pointer;">
                <option value="hadong">Phường Hà Đông (Trường ĐH CMC + Tập trung K5)</option>
                <option value="tungthien">Phường Tùng Thiện (Trường Quân Sự)</option>
            </select>
        </div>

        <div id="map-instruction" class="instruction-box">
            <i class="fa-solid fa-hand-pointer fa-bounce"></i> Chạm vào một điểm mốc cố định trên bản đồ dưới đây để đăng ký chụp!
        </div>

        <div id="flashcard-ui" class="flashcard hidden">
            <h2 id="display-name">Tên Sinh Viên</h2>
            <div class="flashcard-details">
                <span class="badge"><i class="fa-solid fa-id-badge"></i> <span id="display-mssv"></span></span>
                <span class="badge zalo-badge"><i class="fa-solid fa-comment-dots"></i> <span id="display-zalo"></span></span>
            </div>
        </div>

        <div id="queue-ui" class="queue-info hidden">
            <p id="queue-text">Đang tính toán vị trí của bạn...</p>
        </div>

        <div id="map"></div>

        <div id="action-ui" class="action-buttons hidden">
            <button id="btn-change-location" class="btn-secondary">
                Đổi Mốc Hẹn <i class="fa-solid fa-heart fa-beat" style="color: #ff4757; margin-left: 8px;"></i>
            </button>
            <button id="btn-cancel" class="btn-danger">
                Hủy Đăng Ký <span class="emoji-cry">😢</span>
            </button>
        </div>
    </div>

    <audio id="alert-sound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>
    <audio id="bg-music" src="MP3/nhac-nen.mp3" loop preload="auto"></audio>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
